<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Stacked floor plans -->
  <!-- Back plan -->
  <rect x="10" y="18" width="18" height="10" fill="#2980b9" stroke="#2980b9" stroke-width="1.5"/>
  <!-- Middle plan -->
  <rect x="8" y="12" width="18" height="10" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <!-- Front plan (highlighted) -->
  <rect x="6" y="6" width="18" height="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <!-- Grid lines on front plan -->
  <line x1="10" y1="6" x2="10" y2="16" stroke="white" stroke-width="0.5"/>
  <line x1="14" y1="6" x2="14" y2="16" stroke="white" stroke-width="0.5"/>
  <line x1="18" y1="6" x2="18" y2="16" stroke="white" stroke-width="0.5"/>
  <line x1="6" y1="9" x2="24" y2="9" stroke="white" stroke-width="0.5"/>
  <line x1="6" y1="12" x2="24" y2="12" stroke="white" stroke-width="0.5"/>
</svg>
