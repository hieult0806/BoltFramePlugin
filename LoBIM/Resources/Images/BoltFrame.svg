<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Grid frame structure -->
  <g stroke="#2980b9" stroke-width="2" fill="none">
    <!-- Vertical lines -->
    <line x1="6" y1="4" x2="6" y2="28"/>
    <line x1="14" y1="4" x2="14" y2="28"/>
    <line x1="22" y1="4" x2="22" y2="28"/>
    <line x1="30" y1="4" x2="30" y2="28"/>
    <!-- Horizontal lines -->
    <line x1="4" y1="6" x2="28" y2="6"/>
    <line x1="4" y1="14" x2="28" y2="14"/>
    <line x1="4" y1="22" x2="28" y2="22"/>
    <line x1="4" y1="30" x2="28" y2="30"/>
  </g>
  <!-- Bolt symbol in center -->
  <circle cx="16" cy="16" r="4" fill="#2980b9"/>
  <circle cx="16" cy="16" r="2" fill="white"/>
</svg>
